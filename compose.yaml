services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

  ingest:
    profiles: [setup]
    build: .
    depends_on:
      - qdrant
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - model_cache:/cache/huggingface
    command:
      - sh
      - -c
      - python docker/wait_for_qdrant.py && hotel-recommender-engine-ingest --locality Paris --qdrant-url http://qdrant:6333

  api:
    build: .
    depends_on:
      - qdrant
    environment:
      HOTEL_RECOMMENDER_ENGINE_QDRANT_URL: http://qdrant:6333
      HF_HOME: /cache/huggingface
    volumes:
      - model_cache:/cache/huggingface
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - python docker/wait_for_qdrant.py && uvicorn hotel_recommender_engine.api.app:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  qdrant_data:
  model_cache:
